<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetBpm 流程设计器</title>
    <script type="module" crossorigin src="/designer/assets/index-BmPug5L1.js"></script>
    <link rel="stylesheet" crossorigin href="/designer/assets/index-CczC4jZX.css">
  </head>
  <body>
    <!-- ─────────────── 左侧菜单（参考流程管理布局） ─────────────── -->
    <aside class="sidebar">
      <div class="sidebar-title">流程管理<span class="sidebar-caret">^</span></div>
      <nav class="sidebar-menu">
        <a href="#" id="nav-models" class="menu-item active">流程模型列表</a>
        <a href="#" id="nav-deployments" class="menu-item">流程部署列表</a>
      </nav>
    </aside>

    <!-- ─────────────── 右侧主区 ─────────────── -->
    <div class="main-area">
      <!-- 视图一：流程模型列表（默认视图） -->
      <section id="model-list-view" class="view">
        <header class="toolbar">
          <button id="btn-new" type="button" class="primary">新增流程图</button>
          <button id="btn-import" type="button">导入 XML</button>
          <span id="list-status" class="status"></span>
        </header>
        <main class="list-main">
          <table class="diagram-table">
            <thead>
              <tr>
                <th>名字</th>
                <th>key</th>
                <th>修改时间</th>
                <th>版本号</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="diagram-rows"></tbody>
          </table>
          <p id="list-empty" class="list-empty" hidden>
            还没有流程图。点击「新增流程图」开始设计，或「导入 XML」导入已有的 BPMN 文件。
          </p>
        </main>
      </section>

      <!-- 视图二：流程部署列表 -->
      <section id="deploy-list-view" class="view" hidden>
        <header class="toolbar">
          <button id="btn-refresh-deployments" type="button">刷新</button>
          <span id="deploy-status" class="status"></span>
        </header>
        <main class="list-main">
          <table class="diagram-table">
            <thead>
              <tr>
                <th>流程名称</th>
                <th>key</th>
                <th>部署时间</th>
                <th>版本号</th>
              </tr>
            </thead>
            <tbody id="deploy-rows"></tbody>
          </table>
          <p id="deploy-empty" class="list-empty" hidden>还没有部署任何流程。在「流程模型列表」里点击「部署」提交 BPMN。</p>
        </main>
      </section>

      <!-- 视图三：流程图编辑器 -->
      <section id="editor-view" class="view" hidden>
        <header class="toolbar">
          <button id="btn-back" type="button">← 返回列表</button>
          <strong id="editor-title">编辑流程图</strong>
          <span id="status" class="status"></span>
        </header>
        <!-- Activiti 风格图标工具栏（保存/导入导出/剪贴板/撤销重做/缩放） -->
        <div id="icon-toolbar" class="icon-toolbar">
          <button id="it-save" type="button" title="保存">
            <svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM7 3v6h9V3M7 14h10v7H7z"/></svg>
          </button>
          <button id="it-import" type="button" title="导入 XML">
            <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          </button>
          <button id="it-export" type="button" title="导出 XML">
            <svg viewBox="0 0 24 24"><path d="M12 13V3m0 0l-4 4m4-4l4 4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          </button>
          <span class="icon-sep"></span>
          <button id="it-cut" type="button" title="剪切">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.2 7.6L20 19M8.2 16.4L20 5"/></svg>
          </button>
          <button id="it-copy" type="button" title="复制">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          </button>
          <button id="it-paste" type="button" title="粘贴">
            <svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM9 4a2 2 0 1 1 6 0M16 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>
          </button>
          <button id="it-delete" type="button" title="删除选中元素">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6"/></svg>
          </button>
          <span class="icon-sep"></span>
          <button id="it-undo" type="button" title="撤销">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 6 6 6 6 0 0 1-6 6h-4"/></svg>
          </button>
          <button id="it-redo" type="button" title="重做">
            <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0-6 6 6 6 0 0 0 6 6h4"/></svg>
          </button>
          <span class="icon-sep"></span>
          <button id="it-zoom-out" type="button" title="缩小">
            <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15.5 15.5L21 21M7.5 10h5"/></svg>
          </button>
          <button id="it-zoom-in" type="button" title="放大">
            <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15.5 15.5L21 21M7.5 10h5M10 7.5v5"/></svg>
          </button>
          <button id="it-zoom-fit" type="button" title="适应画布">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
        <main class="canvas-row">
          <div id="canvas" class="canvas"></div>
          <div id="panel-resizer" class="panel-resizer" title="拖动调整设置栏宽度；双击恢复默认"></div>
          <aside id="properties" class="properties"></aside>
        </main>
        <!-- 即时校验清单（§6.2 第 3 项）：点击可定位到出问题的元素 -->
        <footer id="issues" class="issues"></footer>
      </section>
    </div>

    <input id="file-input-list" type="file" accept=".xml,.bpmn,.bpmn20.xml" hidden />
    <input id="file-input-editor" type="file" accept=".xml,.bpmn,.bpmn20.xml" hidden />
  </body>
</html>
