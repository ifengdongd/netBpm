# MySQL 5.7 兼容的方言覆盖（⚠️ 只影响**分页 SQL 的生成**，不影响任何引擎语义）。
#
# 背景：Activiti 9.0.0 自带的 org/activiti/db/properties/mysql.properties 假定 **MySQL 8** ——
# 它的分页查询无条件套一层 `row_number() over (ORDER BY ...) rnk`（窗口函数），而 MySQL 5.7 没有
# 窗口函数，任何走分页路径的查询（TaskQuery / HistoricProcessInstanceQuery）都会语法错。
#
# 做法：Activiti 用 `getResourceAsStream("org/activiti/db/properties/" + databaseType + ".properties")`
# 加载该文件（ProcessEngineConfigurationImpl.java:1234），而**本模块的 target/classes 在 classpath 上
# 排在依赖 jar 之前**，因此这里的同名资源会覆盖引擎 jar 里的那份。
#
# 与 Activiti 原版的唯一差别：去掉 row_number 包装，改为"取全部匹配行 + 外层包一层 ranked"。
# 本工具从不为查询设置分页（都是 list()），因此结果集完全一致。

limitAfter=LIMIT #{maxResults} OFFSET #{firstResult}

v3_limitBetween=
v3_after_withLimit=) as RES ) as ranked
v3_after_withoutLimit=) as RES ) as ranked
