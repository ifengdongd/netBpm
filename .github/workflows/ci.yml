# NetBpm CI（任务清单 B1.4）
#
# ⚠️ 测试执行用 `dotnet run --project`（MTP 原生方式）而不是 `dotnet test`：
# xunit.v3 + Microsoft.Testing.Platform 组合下，本仓库的 `dotnet test` 会
# 「运行了零个测试」（exit code 5），直接运行测试程序集则完全正常 ——
# 两个入口执行的是同一个测试程序集，CI 选用可靠的那个。
#
# 差分对拍（NetBpm.DifferentialTests）需要 JDK + Activiti 预言机（tools/Oracle），
# 先在 CI 外准备好预言机产物后再开启该 Job；此处暂不执行（见任务清单 B1.4 的容器化备注）。
name: ci

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Unit tests
        run: dotnet run --project tests/NetBpm.UnitTests --no-build

  integration-tests:
    # 真库测试：MySQL 服务容器 + DbMigrate 建表；
    # 数据库不可用时测试会动态跳过（不会假绿，也不会误红）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Create schema
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build --
          migrate --create-database --provider mysql
          --connection "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=;"

      - name: Integration tests
        env:
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=;Allow User Variables=true;"
        run: dotnet run --project tests/NetBpm.IntegrationTests --no-build
