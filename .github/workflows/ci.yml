name: ci

# 开发计划 P0 的验收要求：CI 在 PR 上跑通（构建 + 测试 + 格式检查）。
on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  backend:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore NetBpm.slnx

      - name: 构建（Release）
        run: dotnet build NetBpm.slnx --no-restore -c Release

      - name: 单元测试
        run: dotnet test tests/NetBpm.UnitTests/NetBpm.UnitTests.csproj -c Release --no-build

      # 对拍器自身的用例不依赖数据库，因此放在无需 MySQL 的作业里
      - name: 对拍器测试
        run: dotnet test tests/NetBpm.DifferentialTests/NetBpm.DifferentialTests.csproj -c Release --no-build

      - name: 格式检查
        run: dotnet format NetBpm.slnx --verify-no-changes --no-restore --verbosity minimal

  integration:
    name: 集成测试（真实 MySQL）
    runs-on: ubuntu-latest
    needs: backend
    # 用容器里的真实 MySQL 验证 §7 的表结构、§7.2 的 13 张表与 §7.3 的 ID 区块分配。
    # 本地没有 MySQL 时这些用例会动态跳过（Assert.SkipUnless），不会失败。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_DATABASE: netbpm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NETBPM_MYSQL_CONNECTION: >-
        Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=;Allow User Variables=true;
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 建库建表（db/mysql 脚本）
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --
          migrate --provider mysql --connection "$NETBPM_MYSQL_CONNECTION"

      - name: 集成测试
        run: dotnet test tests/NetBpm.IntegrationTests/NetBpm.IntegrationTests.csproj -c Release

      # §9.3：自建语料必须由脚本生成。手改了语料、或改了生成器没重新生成，都要让 CI 失败
      - name: 语料漂移校验
        run: dotnet run --project tests/corpus/generator -- --check

      # 对拍机器自测：真值（<stem>.oracle.json）由 tools/Oracle 的 Java 预言机产出。
      # 尚未产出真值时这些用例只验证"机器能跑 + 同语料两次结果一致"，不会、也不应该宣称达标。
      - name: 对拍机器自测
        run: dotnet test tests/NetBpm.DifferentialTests/NetBpm.DifferentialTests.csproj -c Release

  designer:
    name: 设计器构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/designer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查与构建
        run: npm run build

      # 面板的属性映射与即时校验（esbuild 打包 + node --test，不新增依赖）
      - name: 单元测试
        run: npm test
