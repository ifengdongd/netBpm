# NetBpm CI（任务清单 B1.4）
#
# 测试执行用 `dotnet run --project`（MTP 原生方式）；`dotnet test` 同样可用。
# ⚠️ `dotnet test` 不要带 `--nologo`：那是 VSTest 时代的参数，MTP 会透传给测试宿主并被
# 「unknown option」拒绝，表现为「运行了零个测试」（exit code 5）—— 去掉即可正常。
# 两个入口执行的是同一个测试程序集。
#
# 差分对拍（NetBpm.DifferentialTests）单独成 Job：
#   1. 只在 nightly / 手动触发跑（204 个语料各执行两遍 + 一次全批比对，太慢，不适合 push 触发）；
#   2. 真值（<stem>.oracle.json）已随语料入库，因此**不需要 JDK / Maven** ——
#      那两个只在「重新生成真值」时才用到（见 tools/Oracle/README.md）。
# 断言口径见 Job 内注释：先跑批 + 出报告，一致率门禁待数字稳定后再开。
name: ci

on:
  push:
    branches: ["*"]
  pull_request:
  schedule:
    # 每天 03:17 UTC（避开整点的 runner 排队高峰）
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  frontend:
    # wwwroot 构建产物已不再入库（.gitignore），CI 在这里构建 designer + admin 两个前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/designer/package-lock.json
            web/admin/package-lock.json

      - name: Build designer (wwwroot/designer)
        working-directory: web/designer
        run: |
          npm ci
          npm run build

      - name: Lint + typecheck + unit tests (admin)
        working-directory: web/admin
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Build admin (wwwroot)
        working-directory: web/admin
        run: npm run build

      - name: Upload wwwroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: src/NetBpm.Admin/wwwroot/

  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Unit tests
        run: dotnet run --project tests/NetBpm.UnitTests --no-build

  contract-governance:
    # M14/M15 契约治理，四件事一起守：
    #   1. `/workflow/v1` 的 OpenAPI 快照必须与代码生成结果一致；
    #   2. 上一版基线（contracts/baseline/）里的每条路径与响应结构，当前服务仍然满足；
    #   3. sdk/ 下的 TS/Java 产物等于「用当前快照重新生成一遍」，且**都能编译**（tsc / mvn）；
    #   4. 业务面至少还有 20 条路径（防止过滤逻辑放宽后快照悄悄空心化）。
    # 单独成 Job 而不是塞进 build 里当一步 —— 契约破了要一眼看到是「契约」红了，
    # 而不是「构建」红了之后去翻日志才知道是 diff 还是编译错误。
    #
    # ⚠️ 这一关不能靠刷新快照 / 改基线放行：确需变更时，本地设 NETBPM_UPDATE_CONTRACTS=1 重跑
    # ContractSnapshotTests，把 contracts/openapi/workflow-v1.json 的改动当作代码一起评审提交
    # （破坏性变更还要先走 docs/platform-api-refactoring-plan.md §7.2 的公告流程）；
    # 基线只在发版时随快照一起复制，见 contracts/README.md §六。
    # 该 Job 只读端点元数据 + 内存宿主，不需要数据库。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Contract snapshot diff
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.ContractSnapshotTests

      - name: Baseline compatibility (previous release vs current service)
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.CompatibilityTests

      - name: SDK artifacts match snapshot
        run: >
          dotnet run --project tests/NetBpm.UnitTests --no-build --
          -class NetBpm.UnitTests.SdkGenerationTests

      # 生成器是字符串模板：文本比对只能证明「和快照一致」，证明不了「能编译」。
      # 生成器出语法错时，下面两步是唯一会红的关卡（本地验证过不算，本地会忘）。
      - name: Setup Node 20 (SDK)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Compile generated TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Setup JDK 21 (SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile generated Java SDK
        working-directory: sdk/java
        run: mvn -B -q compile

  integration-tests:
    # 真库测试：MySQL 服务容器 + DbMigrate 建表；
    # SqlServer 由测试自己用 Testcontainers 拉起 mssql/server:2022（runner 自带 Docker），
    # 也可用 NETBPM_SQLSERVER_CONNECTION 指到已有实例；
    # 数据库不可用时测试会动态跳过（不会假绿，也不会误红）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # 必须是固定密码 + MYSQL_ROOT_HOST="%"：
          # 官方镜像默认只建 root@localhost，而 service 容器把端口映射到宿主机后，
          # 连接来源是 docker 网关（172.x.x.x）而不是 localhost，root 会被拒（Access denied）。
          # 这在本地看不出来——本地是直连 localhost 上的 MySQL。
          MYSQL_ROOT_PASSWORD: "netbpm"
          MYSQL_ROOT_HOST: "%"
          # 预建库；DbMigrate 的 --create-database 是 if not exists，仍会照跑一遍验证建库逻辑
          MYSQL_DATABASE: "netbpm"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnetbpm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Verify MySQL connectivity
        # 独立一步：这步绿、下一步红，就能立刻把「连不上库」和「迁移脚本本身报错」分开
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build -- probe
          --provider mysql
          --connection "Server=127.0.0.1;Port=3306;User ID=root;Password=netbpm;"

      - name: Create schema
        # 手动捕获输出：失败原因必须落到 check-run annotation 里。
        # 否则 Review 时只看得到「Process completed with exit code 1」，
        # 而真实错误埋在需要凭据才能下载的 job 日志里。
        run: |
          set +e
          output=$(dotnet run --project tools/NetBpm.DbMigrate --no-build -- migrate --create-database \
            --provider mysql \
            --connection "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=netbpm;Allow User Variables=true;" 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | grep -iE 'error|exception|fail|denied|unknown|syntax|invalid|does not exist' | tail -n 5 | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=DbMigrate migrate 失败::exit=${status} ${detail}"
            exit "$status"
          fi

      - name: Integration tests
        # 同 Create schema：把失败的用例名写进 annotation。
        # xUnit 的失败明细在 job 日志里，而 Review 页面只看得到 exit code。
        env:
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=netbpm;Allow User Variables=true;"
        run: |
          set +e
          output=$(dotnet run --project tests/NetBpm.IntegrationTests --no-build -- -noColor 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # 只认 xUnit 的 [FAIL] 行：引擎日志里「失败」出现得太多，
            # 按关键词抓会把正常重试日志当成结论（上一轮就抓成满屏「对端超时」）。
            # 带上后续 3 行：断言失败时 Expected/Actual、抛异常时消息都在紧跟的几行里，
            # 只有用例名等于还得再跑一轮才能知道「差在哪」。
            detail=$(printf '%s' "$output" | grep -A3 -F '[FAIL]' | grep -v '^--$' | head -n 20 | tr '\n' ' ')
            if [ -z "$detail" ]; then
              # 兜底：xUnit 的失败清单与汇总（Total/Failed）在输出末尾
              detail=$(printf '%s' "$output" | tail -n 25 | tr '\n' ' ')
            fi
            echo "::error title=集成测试失败::exit=${status} ${detail:0:1500}"
            exit "$status"
          fi

  differential:
    # 差分对拍：拿 Java 预言机（真 Activiti）产出的三维度真值，比 NetBpm 的实现。
    #
    # 🔑 为什么现在不需要 JDK / Maven：真值 <stem>.oracle.json 已随语料一起入库
    # （tests/corpus/**，204 份），跑批只做「我方执行 + 与真值比对」。
    # 重新生成真值才需要 JDK 21 + 本地 install 的 Activiti 9.0.0（tools/Oracle/README.md），
    # 那是维护者手动做的动作，不是每次流水线都该付的成本。
    #
    # ⚠️ 门禁目前是「跑批不失败 + 产出报告」，**没有**开一致率断言 —— 这是有意的：
    # 2026-11-02 本地实测整体 99.46%（目标 99.5%）、28 条差异待结论（多是 ACT_HI_VARINST.TENANT_ID_
    # 这类空串/null 表达差异）。此时开 Assert.True(report.WithinGate()) 只会让门禁天天红，
    # 而红的原因既不是「引擎退步」也不是「真值陈旧」，是差异还没收口 —— 天天红的门禁等于没有门禁。
    # 收口动作：把 28 条逐条判成「口径差异（回写代码）」或「有意偏离（进 known-issues.json）」，
    # 数字稳定达线后再把断言打开。在此之前，报告以 artifact 上传，由人看。
    #
    # 只在 nightly / 手动触发跑：每个语料要执行两遍（确定性用），全批 204 个，太慢。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "netbpm"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnetbpm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Differential run (against Activiti oracle)
        # 对拍库是独立的 netbpm_diff（TestDatabase 自动建库建表）：与集成测试的 netbpm 分开，
        # 因为每个语料跑之前都会 purge 引擎表，共用会互相清库。
        env:
          NETBPM_DIFF_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm_diff;User ID=root;Password=netbpm;Allow User Variables=true;"
        run: |
          set +e
          output=$(dotnet run --project tests/NetBpm.DifferentialTests --no-build -- -noColor -class NetBpm.DifferentialTests.DifferentialRunnerTests 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | grep -A3 -F '[FAIL]' | grep -v '^--$' | head -n 20 | tr '\n' ' ')
            if [ -z "$detail" ]; then
              detail=$(printf '%s' "$output" | tail -n 25 | tr '\n' ' ')
            fi
            echo "::error title=差分对拍失败::exit=${status} ${detail:0:1500}"
            exit "$status"
          fi

      - name: Upload differential report
        # 报告是给人看的差异清单：一致率达标与否在 CI 里是 exit code，
        # 但「差在哪一行、归到哪个语料」只有 report.md 说清楚。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: artifacts/differential/
          if-no-files-found: warn
