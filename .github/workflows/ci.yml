# NetBpm CI（任务清单 B1.4）
#
# 测试执行用 `dotnet run --project`（MTP 原生方式）；`dotnet test` 同样可用。
# ⚠️ `dotnet test` 不要带 `--nologo`：那是 VSTest 时代的参数，MTP 会透传给测试宿主并被
# 「unknown option」拒绝，表现为「运行了零个测试」（exit code 5）—— 去掉即可正常。
# 两个入口执行的是同一个测试程序集。
#
# 差分对拍（NetBpm.DifferentialTests）单独成 Job：
#   1. 只在 nightly / 手动触发跑（204 个语料各执行两遍 + 一次全批比对，太慢，不适合 push 触发）；
#   2. 真值（<stem>.oracle.json）已随语料入库，因此**不需要 JDK / Maven** ——
#      那两个只在「重新生成真值」时才用到（见 tools/Oracle/README.md）。
# 断言口径见 Job 内注释：先跑批 + 出报告，一致率门禁待数字稳定后再开。
name: ci

on:
  push:
    branches: ["*"]
  pull_request:
  schedule:
    # 每天 03:17 UTC（避开整点的 runner 排队高峰）
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  frontend:
    # wwwroot 构建产物已不再入库（.gitignore），CI 在这里构建 designer + admin 两个前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/designer/package-lock.json
            web/admin/package-lock.json

      - name: Build designer (wwwroot/designer)
        working-directory: web/designer
        run: |
          npm ci
          npm run build

      - name: Lint + typecheck + unit tests (admin)
        working-directory: web/admin
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Build admin (wwwroot)
        working-directory: web/admin
        run: npm run build

      - name: Upload wwwroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: src/NetBpm.Admin/wwwroot/

  build-and-unit-tests:
    runs-on: ubuntu-latest

    services:
      # Redis 作业队列的用例（RedisJobQueue*、启动自检）对着真 Redis 跑。
      # 没有它，这些用例是**静默跳过**的 —— 绿灯里藏着一整条没验证过的路径。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Unit tests
        env:
          NETBPM_TEST_REDIS: "127.0.0.1:6379"
        run: dotnet run --project tests/NetBpm.UnitTests --no-build

  contract-governance:
    # M14/M15 契约治理，四件事一起守：
    #   1. `/workflow/v1` 的 OpenAPI 快照必须与代码生成结果一致；
    #   2. 上一版基线（contracts/baseline/）里的每条路径与响应结构，当前服务仍然满足；
    #   3. sdk/ 下的 TS/Java 产物等于「用当前快照重新生成一遍」，且**都能编译**（tsc / mvn）；
    #   4. 业务面至少还有 20 条路径（防止过滤逻辑放宽后快照悄悄空心化）。
    # 单独成 Job 而不是塞进 build 里当一步 —— 契约破了要一眼看到是「契约」红了，
    # 而不是「构建」红了之后去翻日志才知道是 diff 还是编译错误。
    #
    # ⚠️ 这一关不能靠刷新快照 / 改基线放行：确需变更时，本地设 NETBPM_UPDATE_CONTRACTS=1 重跑
    # ContractSnapshotTests，把 contracts/openapi/workflow-v1.json 的改动当作代码一起评审提交
    # （破坏性变更还要先走 docs/platform-api-refactoring-plan.md §7.2 的公告流程）；
    # 基线只在发版时随快照一起复制，见 contracts/README.md §六。
    # 该 Job 只读端点元数据 + 内存宿主，不需要数据库。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Contract snapshot diff
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.ContractSnapshotTests

      - name: Baseline compatibility (previous release vs current service)
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.CompatibilityTests

      - name: Admin surface snapshot diff (internal consistency)
        # 管理面不对外承诺兼容，但它与同仓库的控制台是一份契约：
        # 后端删 / 改端点时，控制台不会编译失败，只会在某次点击时 404。
        # 这一步守的是「静默漂移」，不是「禁止不兼容」。
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.AdminContractSnapshotTests

      - name: Surface boundary (engine vs platform surface)
        # 钉住「管理干预 / 变量直写 / 外部任务只在 /api/**」这个决策；
        # 将来要搬到平台面，先改决策与这份用例，而不是悄悄加端点。
        run: >
          dotnet run --project tests/NetBpm.IntegrationTests --no-build --
          -class NetBpm.IntegrationTests.SurfaceBoundaryTests

      - name: SDK artifacts match snapshot
        run: >
          dotnet run --project tests/NetBpm.UnitTests --no-build --
          -class NetBpm.UnitTests.SdkGenerationTests

      # 生成器是字符串模板：文本比对只能证明「和快照一致」，证明不了「能编译」。
      # 生成器出语法错时，下面两步是唯一会红的关卡（本地验证过不算，本地会忘）。
      - name: Setup Node 20 (SDK)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Compile generated TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Setup JDK 21 (SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile generated Java SDK
        working-directory: sdk/java
        run: mvn -B -q compile

  integration-tests:
    # 真库测试：MySQL 服务容器 + DbMigrate 建表；
    # SqlServer 由测试自己用 Testcontainers 拉起 mssql/server:2022（runner 自带 Docker），
    # 也可用 NETBPM_SQLSERVER_CONNECTION 指到已有实例；
    # 数据库不可用时测试会动态跳过（不会假绿，也不会误红）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # 必须是固定密码 + MYSQL_ROOT_HOST="%"：
          # 官方镜像默认只建 root@localhost，而 service 容器把端口映射到宿主机后，
          # 连接来源是 docker 网关（172.x.x.x）而不是 localhost，root 会被拒（Access denied）。
          # 这在本地看不出来——本地是直连 localhost 上的 MySQL。
          MYSQL_ROOT_PASSWORD: "netbpm"
          MYSQL_ROOT_HOST: "%"
          # 预建库；DbMigrate 的 --create-database 是 if not exists，仍会照跑一遍验证建库逻辑
          MYSQL_DATABASE: "netbpm"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnetbpm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 30s
      redis:
        # 与单测 Job 同一个理由：RedisRateLimitTests 等对着真 Redis 才有意义
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Pre-pull SqlServer image
        # Testcontainers 会在测试里自己拉 mssql/server:2022（约 1.5GB）。
        # 提前拉有两个好处：① 拉镜像的失败早暴露，不会混进「测试超时」里；
        # ② 少一点 Testcontainers 默认超时被大镜像拖爆的概率。
        # 失败不阻断：SqlServer 那一路会正常跳过，由 Coverage statement 标出来。
        continue-on-error: true
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Verify MySQL connectivity
        # 独立一步：这步绿、下一步红，就能立刻把「连不上库」和「迁移脚本本身报错」分开
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build -- probe
          --provider mysql
          --connection "Server=127.0.0.1;Port=3306;User ID=root;Password=netbpm;"

      - name: Create schema
        # 手动捕获输出：失败原因必须落到 check-run annotation 里。
        # 否则 Review 时只看得到「Process completed with exit code 1」，
        # 而真实错误埋在需要凭据才能下载的 job 日志里。
        run: |
          set +e
          output=$(dotnet run --project tools/NetBpm.DbMigrate --no-build -- migrate --create-database \
            --provider mysql \
            --connection "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=netbpm;Allow User Variables=true;" 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | grep -iE 'error|exception|fail|denied|unknown|syntax|invalid|does not exist' | tail -n 5 | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=DbMigrate migrate 失败::exit=${status} ${detail}"
            exit "$status"
          fi

      - name: Integration tests
        # 同 Create schema：把失败的用例名写进 annotation。
        # xUnit 的失败明细在 job 日志里，而 Review 页面只看得到 exit code。
        env:
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=netbpm;Allow User Variables=true;"
          NETBPM_TEST_REDIS: "127.0.0.1:6379"
        run: |
          set +e
          output=$(dotnet run --project tests/NetBpm.IntegrationTests --no-build -- -noColor 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # 只认 xUnit 的 [FAIL] 行：引擎日志里「失败」出现得太多，
            # 按关键词抓会把正常重试日志当成结论（上一轮就抓成满屏「对端超时」）。
            # 带上后续 3 行：断言失败时 Expected/Actual、抛异常时消息都在紧跟的几行里，
            # 只有用例名等于还得再跑一轮才能知道「差在哪」。
            detail=$(printf '%s' "$output" | grep -A3 -F '[FAIL]' | grep -v '^--$' | head -n 20 | tr '\n' ' ')
            if [ -z "$detail" ]; then
              # 兜底：xUnit 的失败清单与汇总（Total/Failed）在输出末尾
              detail=$(printf '%s' "$output" | tail -n 25 | tr '\n' ' ')
            fi
            echo "::error title=集成测试失败::exit=${status} ${detail:0:1500}"
            exit "$status"
          fi

      - name: Coverage statement (skipped / 未覆盖的可选路径)
        # 为什么要有这一步：约 130 处 Assert.Skip* 是**静默**的 —— exit code 是绿的，
        # 但「本轮其实没验证过某些路径」这件事没人看见。这里把它们显式写进 job summary：
        # 绿就绿得明白，缺什么一眼可见。
        #
        # Redis 与 SqlServer 现在都有服务容器 / 预热步骤（见本 Job 顶部与 Pre-pull 步骤），
        # 因此这里主要起**复核**作用：真没跑成就标黄，而不是默认「应该跑了」。
        if: always()
        env:
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=netbpm;Allow User Variables=true;"
          NETBPM_TEST_REDIS: "127.0.0.1:6379"
        run: |
          docker_ok="否"
          if docker version >/dev/null 2>&1; then docker_ok="是"; fi

          # 真探一次，而不是看环境变量有没有设：环境变量设了但 Redis 没起来，跳过照样发生
          redis_ok="否"
          if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then redis_ok="是"; exec 3<&-; fi

          {
            echo "### 可选依赖覆盖情况"
            echo
            echo "| 依赖 | 本轮是否覆盖 | 说明 |"
            echo "|---|---|---|"
            echo "| MySQL（真库集成测试） | ✅ 是 | 服务容器 mysql:8.4 |"
            echo "| Redis（作业队列 / 限流） | $([ "$redis_ok" = "是" ] && echo '✅ 是' || echo '⚠️ 否') | 服务容器 redis:7-alpine，端口探活=$redis_ok |"
            echo "| SqlServer（双库功能矩阵） | $([ "$docker_ok" = "是" ] && echo '✅ 视 Testcontainers 拉起结果' || echo '⚠️ 否') | docker 可用=$docker_ok |"
            echo
            echo "> 跳过不算通过。Redis 现在有服务容器；SqlServer 靠 Testcontainers —— 拉不起镜像时"
            echo "> 那一路会静默跳过，所以这一步是它的**唯一**可见信号。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$redis_ok" != "是" ]; then
            echo "::warning title=Redis 路径未覆盖::6379 探活失败，依赖 Redis 的用例本轮被跳过"
          fi
          if [ "$docker_ok" != "是" ]; then
            echo "::warning title=SqlServer 路径未覆盖::Docker 不可用，双库功能矩阵本轮被跳过"
          fi

  load-tests:
    # 性能门禁：默认不跑，只在 nightly / 手动触发跑。
    #
    # 🔑 为什么不放进 integration-tests：
    #   ① 它的数字随机器跳动，挂在每个 PR 上会变成「今天红明天绿」，最后没人敢动；
    #   ② 它必须先清库 —— 列表读的耗时与历史单条数强相关，和真库集成用例共用一个库时
    #      测的是「这台 runner 上堆了多少数据」，不是代码有没有回归（v1.28 踩过：p95 ≈ 10s）。
    #
    # 阈值：详情读 80ms / 列表读 300ms（回归线，不是达标线）/ 写 200ms，
    # 可用 NETBPM_LOAD_*_P95_MS 覆盖。列表读的 300ms 是有意放宽的：
    # 租户过滤与排序仍在内存里做，根治要自建实例索引表（另一个项目），
    # 给它套 80ms 只会得到一条永远红的用例。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "netbpm"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: "netbpm_load"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnetbpm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Verify MySQL connectivity
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build -- probe
          --provider mysql
          --connection "Server=127.0.0.1;Port=3306;User ID=root;Password=netbpm;"

      - name: Create schema (dedicated load database)
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build -- migrate --create-database
          --provider mysql
          --connection "Server=127.0.0.1;Port=3306;Database=netbpm_load;User ID=root;Password=netbpm;Allow User Variables=true;"

      - name: Load gate
        # 单独一步：性能红了要一眼看到是「性能」，而不是「集成测试」红了之后翻日志。
        env:
          NETBPM_RUN_LOAD_TESTS: "1"
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm_load;User ID=root;Password=netbpm;Allow User Variables=true;"
          NETBPM_LOAD_READ_P95_MS: "80"
          NETBPM_LOAD_LIST_P95_MS: "300"
          NETBPM_LOAD_WRITE_P95_MS: "200"
        run: |
          set +e
          output=$(dotnet run --project tests/NetBpm.IntegrationTests --no-build -- \
            -class NetBpm.IntegrationTests.LoadTests -noColor 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | grep -A3 -F '[FAIL]' | head -n 20 | tr '\n' ' ')
            echo "::error title=性能门禁失败::exit=${status} ${detail:0:1500}"
            exit "$status"
          fi

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## 性能门禁（串行压，5s 并发兜底）"
            echo
            echo "| 场景 | 门禁 | 口径 |"
            echo "|---|---|---|"
            echo "| 详情读 | p95 < 80ms | 真实目标 |"
            echo "| 列表读 | p95 < 300ms | **回归线**（租户过滤与排序仍在内存） |"
            echo "| 写 | p95 < 200ms | 真实目标 |"
            echo
            echo "> 并发只留 5s 兜底：并发下的 p95 主要反映 .NET 线程池扩线程速率与机器排队，"
            echo "> 把它当代码性能指标会得到一条没人敢动的红用例。"
          } >> "$GITHUB_STEP_SUMMARY"

  differential:
    # 差分对拍：拿 Java 预言机（真 Activiti）产出的三维度真值，比 NetBpm 的实现。
    #
    # 🔑 为什么现在不需要 JDK / Maven：真值 <stem>.oracle.json 已随语料一起入库
    # （tests/corpus/**，204 份），跑批只做「我方执行 + 与真值比对」。
    # 重新生成真值才需要 JDK 21 + 本地 install 的 Activiti 9.0.0（tools/Oracle/README.md），
    # 那是维护者手动做的动作，不是每次流水线都该付的成本。
    #
    # ✅ 门禁已开（2026-11-02）：`DifferentialRunnerTests.Gate_ShouldBeWithinThreshold`
    # 断言 `report.WithinGate()` —— 三个维度各自达线 + 整体 ≥99.5% + 差异 100% 有结论 + 无跑不动的语料。
    # 达线动作是**回写代码**而不是放宽门禁：28 条待结论差异全是 ACT_HI_VARINST.TENANT_ID_
    # 「期望 null / 实际 ''」（Activiti 的历史变量实体没有租户字段），把无租户时这一列写成 null 之后
    # 整体 99.46% → **99.61%**、待结论 28 → 0。台账 known-issues.json 只收确实无法消除的偏离。
    #
    # 只在 nightly / 手动触发跑：每个语料要执行两遍（确定性用），全批 204 个，太慢。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "netbpm"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnetbpm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4
        with:
          # 真值新鲜度检查读的是 git 提交时间：浅克隆里所有文件的提交时间相同，
          # 检查会静默通过（等于没检查）。完整历史是这道检查能生效的前提。
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Oracle freshness (语料改过 ⇒ 真值必须重跑)
        # 真值是人工跑 Java 预言机产出的，CI 只消费不生产。语料一改而真值没重跑，
        # 后面那一步比的就是「新语料 vs 旧真值」，差异看着像引擎退步其实是真值过期 ——
        # 所以这一步必须**先于**跑批，且失败即停（不带着过期真值去下一个结论）。
        run: >
          dotnet run --project tests/NetBpm.DifferentialTests --no-build -- -noColor
          -class NetBpm.DifferentialTests.OracleFreshnessTests

      - name: Differential run (against Activiti oracle)
        # 对拍库是独立的 netbpm_diff（TestDatabase 自动建库建表）：与集成测试的 netbpm 分开，
        # 因为每个语料跑之前都会 purge 引擎表，共用会互相清库。
        env:
          NETBPM_DIFF_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm_diff;User ID=root;Password=netbpm;Allow User Variables=true;"
        run: |
          set +e
          output=$(dotnet run --project tests/NetBpm.DifferentialTests --no-build -- -noColor -class NetBpm.DifferentialTests.DifferentialRunnerTests 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | grep -A3 -F '[FAIL]' | grep -v '^--$' | head -n 20 | tr '\n' ' ')
            if [ -z "$detail" ]; then
              detail=$(printf '%s' "$output" | tail -n 25 | tr '\n' ' ')
            fi
            echo "::error title=差分对拍失败::exit=${status} ${detail:0:1500}"
            exit "$status"
          fi

      - name: Gate margin (job summary)
        # 已登记的差异仍计入一致率：门禁过了不代表「还很宽裕」。
        # 把余量写进 job summary，nightly 扫一眼就知道下一次差异还能不能靠登记消化。
        if: always()
        run: |
          {
            echo "### 对拍门禁余量"
            echo
            if [ -f artifacts/differential/report.md ]; then
              sed -n '/### 门禁余量/,/^$/p' artifacts/differential/report.md
              sed -n '/| 维度 | 参与比对单元格/,/^$/p' artifacts/differential/report.md
            else
              echo "（未产出报告）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload differential report
        # 报告是给人看的差异清单：一致率达标与否在 CI 里是 exit code，
        # 但「差在哪一行、归到哪个语料」只有 report.md 说清楚。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: artifacts/differential/
          if-no-files-found: warn
