# NetBpm CI（任务清单 B1.4）
#
# 测试执行用 `dotnet run --project`（MTP 原生方式）；`dotnet test` 同样可用。
# ⚠️ `dotnet test` 不要带 `--nologo`：那是 VSTest 时代的参数，MTP 会透传给测试宿主并被
# 「unknown option」拒绝，表现为「运行了零个测试」（exit code 5）—— 去掉即可正常。
# 两个入口执行的是同一个测试程序集。
#
# 差分对拍（NetBpm.DifferentialTests）需要 JDK + Activiti 预言机（tools/Oracle），
# 先在 CI 外准备好预言机产物后再开启该 Job；此处暂不执行（见任务清单 B1.4 的容器化备注）。
name: ci

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  frontend:
    # wwwroot 构建产物已不再入库（.gitignore），CI 在这里构建 designer + admin 两个前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/designer/package-lock.json
            web/admin/package-lock.json

      - name: Build designer (wwwroot/designer)
        working-directory: web/designer
        run: |
          npm ci
          npm run build

      - name: Lint + typecheck + unit tests (admin)
        working-directory: web/admin
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Build admin (wwwroot)
        working-directory: web/admin
        run: npm run build

      - name: Upload wwwroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: src/NetBpm.Admin/wwwroot/

  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Unit tests
        run: dotnet run --project tests/NetBpm.UnitTests --no-build

  integration-tests:
    # 真库测试：MySQL 服务容器 + DbMigrate 建表；
    # SqlServer 由测试自己用 Testcontainers 拉起 mssql/server:2022（runner 自带 Docker），
    # 也可用 NETBPM_SQLSERVER_CONNECTION 指到已有实例；
    # 数据库不可用时测试会动态跳过（不会假绿，也不会误红）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build NetBpm.slnx --nologo

      - name: Create schema
        run: >
          dotnet run --project tools/NetBpm.DbMigrate --no-build --
          migrate --create-database --provider mysql
          --connection "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=;"

      - name: Integration tests
        env:
          NETBPM_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=netbpm;User ID=root;Password=;Allow User Variables=true;"
        run: dotnet run --project tests/NetBpm.IntegrationTests --no-build
